name: Backend (.NET 9) - Build, Test & SonarCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dev project
      run: dotnet restore backend/src/Dev/Dev.csproj

    - name: Build Dev project
      run: dotnet build backend/src/Dev/Dev.csproj --no-restore

    - name: Test Dev project with coverage
      run: |
        dotnet test backend/src/Dev/Dev.csproj \
          --no-build \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=opencover

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        projectBaseDir: backend
        args: >
          -Dsonar.projectKey=chitmeo_family
          -Dsonar.organization=chitmeo
          -Dsonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
